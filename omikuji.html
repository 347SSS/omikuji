<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="omikuji.css">
 <title>今日のおみくじ</title>
</head>

<body>
  <main class="omikuji-box">
    <h1>今日のおみくじ</h1>
    
    <p id="today"></p>
     <p class="lead">
      今日の運勢を占ってみよう！
    </p>

     <div class="form-area">

      <label for="user-name">
        名前を入力してください
      </label>

     <input
        type="text"
        id="user-name"
        maxlength="20"
        placeholder="例：田中太郎"
      >

        <button id="assessment">
        おみくじを引く
      </button>

    </div>
    
   <p id="error-message"></p>

<!-- おみくじアニメーション -->
<div id="omikuji-animation">
  <div class="omikuji-draw-box">おみくじ</div>
</div>

  <div id="result-area"></div>
  <div id="tweet-area"></div>

  <script src="omikuji.js"></script>
</body>
</html>
